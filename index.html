<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>MiniTrack</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><link href="minitrack.css" rel="stylesheet"><style>#map{position:fixed;inset:0}#top{gap:6px;right:64px}#planBtn{display:none!important}#planPanel,#routeInfo,#trackPanel{display:none;position:absolute;z-index:8;left:8px;right:8px;bottom:8px;max-width:560px;background:rgba(255,255,255,.97);border-radius:14px;padding:10px 12px;box-shadow:0 2px 14px rgba(0,0,0,.24)}#routeInfo{bottom:48px;z-index:7}#planPanel{display:none!important}#planPanel .row,#trackActions,#routeActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}#planPanel button,#trackActions button,#routeActions button{flex:1;min-height:40px;min-width:110px}.planline{font-size:13px;margin:4px 0}.routegrid,.trackstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.routegrid span,.trackstats span{font-size:12px}.routegrid b,.trackstats b{display:block;font-size:17px}#layersBtn{position:absolute;z-index:13;right:10px;top:8px;width:46px;height:46px;padding:0;border-radius:13px;background:rgba(255,255,255,.97);color:#222;border:1px solid #ccc;box-shadow:0 2px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}.layerIcon{position:relative;width:25px;height:23px}.layerIcon span{position:absolute;left:3px;width:19px;height:12px;border:2px solid currentColor;border-radius:3px;transform:rotate(30deg) skewX(-28deg);background:#fff}.layerIcon span:nth-child(1){top:0}.layerIcon span:nth-child(2){top:5px}.layerIcon span:nth-child(3){top:10px}#navControls{display:none;position:absolute;z-index:10;right:64px;top:10px;gap:8px}#navControls button{width:48px;height:48px;padding:0;border-radius:14px;background:rgba(255,255,255,.96);color:#222;border:1px solid #ccc;box-shadow:0 2px 10px rgba(0,0,0,.2);font-weight:800;font-size:16px}#navControls button.active{background:#1769d2;color:#fff;border-color:#1769d2}#layersNav{display:none!important}#directionCard{display:none;position:absolute;z-index:9;top:10px;left:10px;background:rgba(255,255,255,.97);border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2);min-width:150px}#directionArrow{display:inline-block;font-size:46px;line-height:46px;transform-origin:center;vertical-align:middle}#directionText{font-size:13px;margin-left:7px;font-weight:700}.smallnote{font-size:11px;color:#666}#layerPanel{display:none;position:absolute;z-index:12;right:10px;top:62px;background:rgba(255,255,255,.98);padding:7px;border-radius:13px;box-shadow:0 2px 12px rgba(0,0,0,.24);min-width:145px}#layerPanel button{display:block;width:100%;min-height:42px;margin:2px 0;text-align:left;border-radius:9px;background:#fff;color:#222;border:1px solid #ddd}#layerPanel button.active{background:#1769d2;color:#fff;border-color:#1769d2}.layerToggle{white-space:nowrap}@media(max-width:420px){#top input{min-width:0}#searchBtn{display:none}.routegrid,.trackstats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="map"></div><div id="top"><input id="q" autocomplete="off" placeholder="Ort, Alm oder Hütte suchen"><button id="searchBtn">Suche</button><button id="gpsBtn" title="Standort">◎</button></div><button id="layersBtn" class="layerToggle" title="Kartenebenen" aria-label="Kartenebenen"><span class="layerIcon" aria-hidden="true"><span></span><span></span><span></span></span></button><button id="planBtn" aria-hidden="true">Planen</button><div id="suggestions"></div><div id="filters"><label class="chip"><input id="routesChk" type="checkbox" checked>Wanderwege</label><label class="chip"><input id="almsChk" type="checkbox" checked>Almen</label><label class="chip"><input id="hutsChk" type="checkbox" checked>Hütten</label><label class="chip"><input id="foodChk" type="checkbox" checked>Berggasthäuser</label><label class="chip"><input id="peaksChk" type="checkbox">Gipfel</label></div><div id="navControls"><button id="followMe" class="active" title="Meiner Position folgen">◎</button><button id="northUp" title="Nach Norden ausrichten">N↑</button><button id="layersNav" class="layerToggle" title="Kartenebenen">▱</button></div><div id="layerPanel"><button class="baseChoice active" data-base="map">Karte</button><button class="baseChoice" data-base="topo">Topo</button><button class="baseChoice" data-base="satellite">Satellit</button></div><div id="directionCard"><span id="directionArrow">↑</span><span id="directionText">Route folgen</span></div><div id="planPanel"><b>Route planen</b><div id="planStartText" class="planline">Start: noch nicht gewählt</div><div id="planViaText" class="planline">Zwischenpunkte: 0</div><div id="planGoalText" class="planline">Ziel: noch nicht gewählt</div><div class="row"><button id="planGps" class="good">Start = Standort</button><button id="planStartMap" class="secondary">Start Karte</button><button id="planVia" class="secondary">+ Zwischenpunkt</button><button id="planGoal" class="secondary">Ziel Karte</button></div><div class="row"><button id="planCalc" class="good">Route berechnen</button><button id="planCancel" class="secondary">Schließen</button></div></div><div id="routeInfo"><b id="routeTitle">Route</b><div id="routeText" class="small"></div><div class="routegrid"><span>Noch<b id="routeRemain">—</b></span><span>Höhenber.<b id="routeEffort">—</b></span><span>Aufstieg<b id="routeRemainUp">—</b></span></div><div class="smallnote">Weitere Punkte einfach auf der Karte antippen.</div><div id="routeActions"><button id="startRoute" class="good">▶ Start</button><button id="clearRoute" class="secondary">Route löschen</button></div></div><div id="trackPanel"><b id="trackTitle">Tracking</b><div class="trackstats"><span>Zeit<b id="trackTime">00:00</b></span><span>Gelaufen<b id="trackDist">0.00 km</b></span><span>Noch<b id="trackRemain">—</b></span><span>Höhenber.<b id="trackEffort">—</b></span><span>Rest ↑<b id="trackUp">—</b></span></div><div id="trackActions"><button id="pauseTrack" class="secondary">Pause</button><button id="stopTrack" class="warn">Stop</button><button id="saveTrack" class="good" style="display:none">Speichern</button></div></div><div id="status">Tippe auf die Karte: erster Punkt = Start.</div><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="minitrack.js"></script><script src="layers.js"></script><script src="direct-plan.js"></script></body></html>
