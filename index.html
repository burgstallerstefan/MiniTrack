:2px;top:6px}#layersBtn .stack i:nth-child(3){left:1px;top:12px}#quickTerrainBtn{width:46px;height:46px;padding:0;min-width:46px;border-radius:12px;background:#222;color:#fff;border:0;font-weight:900;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.2)}#quickTerrainBtn:not(.active){background:#fff;color:#222;border:1px solid #bbb}#filters{right:auto!important;max-width:none!important;align-items:flex-start}#filterToggle{min-height:44px;background:rgba(255,255,255,.97);color:#222;border:1px solid #ccc;border-radius:13px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:0 14px}#filterToggle.active{background:#222;color:#fff}#filterMenu{display:none;position:absolute;left:0;top:50px;min-width:245px;background:rgba(255,255,255,.98);border:1px solid #ddd;border-radius:14px;padding:7px;box-shadow:0 5px 18px rgba(0,0,0,.22)}#filterMenu.open{display:grid;gap:2px}.filterOption{display:grid;grid-template-columns:24px 22px 1fr;align-items:center;min-height:42px;padding:0 8px;border-radius:9px;font-size:14px;background:#fff}.filterOption input{margin:0}.filterDot{width:15px;height:15px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aaa}.filterLine{width:19px;height:5px;border-radius:4px;background:#7a24b8}.fd-alm{background:#c44}.fd-hut{background:#6b8e23}.fd-food{background:#b36b00}.fd-locality{background:#4d78a8}.fd-peak{background:#333}#navControls{display:none;position:absolute;z-index:10;right:10px;top:68px;gap:8px}#navControls button{width:48px;height:48px;padding:0;border-radius:14px;background:rgba(255,255,255,.96);color:#222;border:1px solid #ccc;box-shadow:0 2px 10px rgba(0,0,0,.2);font-weight:800;font-size:16px}#navControls button.active{background:#1769d2;color:#fff;border-color:#1769d2}#layersNav{display:none!important}#directionCard{display:none;position:absolute;z-index:9;top:10px;left:10px;background:rgba(255,255,255,.97);border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2);min-width:150px}#directionArrow{display:inline-block;font-size:46px;line-height:46px;transform-origin:center;vertical-align:middle}#directionText{font-size:13px;margin-left:7px;font-weight:700}.smallnote{font-size:11px;color:#666}#layerPanel{display:none;position:absolute;z-index:41;right:8px;top:60px;background:rgba(255,255,255,.98);padding:7px;border-radius:13px;box-shadow:0 2px 12px rgba(0,0,0,.24);min-width:145px}#layerPanel button{display:block;width:100%;min-height:42px;margin:2px 0;text-align:left;border-radius:9px;background:#fff;color:#222;border:1px solid #ddd}#layerPanel button.active{background:#1769d2;color:#fff;border-color:#1769d2}.layerToggle{white-space:nowrap}@media(max-width:420px){#top input{min-width:0}#searchBtn{display:none}}</style></head><body><div id="map"></div><div id="top"><input id="q" autocomplete="off" placeholder="Ort, Alm, Gasthaus oder Unterkunft suchen"><button id="searchBtn">Suche</button><button id="gpsBtn" title="Standort">◎</button><button id="layersBtn" class="layerToggle" title="Kartenebenen" aria-label="Kartenebenen"><span class="stack"><i></i><i></i><i></i></span></button><button id="quickTerrainBtn" title="3D-Gelände einschalten" aria-label="3D-Gelände einschalten">3D</button></div><button id="planBtn" aria-hidden="true">Planen</button><div id="suggestions"></div><div id="filters"><button id="filterToggle" type="button" aria-expanded="false">Karteninhalt ▾</button><div id="filterMenu"><label class="filterOption"><input id="routesChk" type="checkbox" checked><span class="filterLine"></span><span>Wanderwege</span></label><label class="filterOption"><input id="almsChk" type="checkbox" checked><span class="filterDot fd-alm"></span><span>Almen</span></label><label class="filterOption"><input id="hutsChk" type="checkbox" checked><span class="filterDot fd-hut"></span><span>Hütten</span></label><label class="filterOption"><input id="foodChk" type="checkbox" checked><span class="filterDot fd-food"></span><span>Gasthäuser & Unterkünfte</span></label><label class="filterOption"><input id="loc
